<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant - KrishiKalyan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .mic-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* Outer pad - same footprint as the old mic-btn, now driven by --scale/--glow */
  .logo-pad {
    --scale: 1;
    --glow: 0.15;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--forest), var(--forest-dark));
    border: none;
    color: var(--paper-card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transform: scale(var(--scale));
    box-shadow: 0 0 calc(var(--glow) * 46px) calc(var(--glow) * 10px) rgba(22, 48, 30, calc(var(--glow) * 0.55)),
                0 3px 14px rgba(22, 48, 30, 0.25);
    transition: background 0.4s ease, box-shadow 0.15s ease;
    will-change: transform;
  }
  .logo-pad:hover { filter: brightness(1.04); }

  /* User is talking - warm rust tones, matches the old "active/recording" state */
  .logo-pad.is-listening {
    background: linear-gradient(135deg, var(--rust), #8a3a1f);
    box-shadow: 0 0 calc(var(--glow) * 50px) calc(var(--glow) * 12px) rgba(168, 75, 42, calc(var(--glow) * 0.6)),
                0 3px 14px rgba(22, 48, 30, 0.25);
  }

  /* Assistant is talking - brighter forest/gold tones */
  .logo-pad.is-speaking {
    background: linear-gradient(135deg, var(--forest), var(--gold));
    box-shadow: 0 0 calc(var(--glow) * 50px) calc(var(--glow) * 12px) rgba(199, 168, 74, calc(var(--glow) * 0.55)),
                0 3px 14px rgba(22, 48, 30, 0.25);
  }

  .logo-icon {
    width: 46px;
    height: 46px;
    overflow: visible;
  }
  .logo-icon path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* JS sets an inline rotate() transform per frame on these three groups */
  .leaf-tip  { transform-origin: 12px 6px; }
  .leaf-mid  { transform-origin: 12px 10px; }
  .leaf-base { transform-origin: 12px 14px; }

  .mic-status {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .captions {
    max-width: 620px;
    margin: 0 auto;
    max-height: 320px;
    overflow-y: auto;
  }
  .caption-line {
    margin-bottom: 14px;
    animation: fadeIn 0.3s ease both;
  }
  .caption-line .who {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 2px;
  }
  .caption-line.user .who { color: var(--gold); }
  .caption-line.assistant .who { color: var(--forest); }
  .caption-line p { margin: 0; font-size: 0.92rem; }

  @media (prefers-reduced-motion: reduce) {
    .logo-pad, .leaf-tip, .leaf-mid, .leaf-base { transition: none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="wordmark"><svg class="wordmark-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V6M12 6l-3-3M12 6l3-3M9 10l-3-2M9 10l3 1M15 10l3-2M15 10l-3 1M9 14l-3-2M9 14l3 1M15 14l3-2M15 14l-3 1"/></svg>Krishi<span>Kalyan</span></a>
    <nav class="tabs">
      <a href="/index.html">Analyze</a>
      <a href="/reports.html">Reports</a>
      <a href="/voice-chat.html" class="active">Voice Assistant</a>
    </nav>
  </div>
</div>

<div class="wrap">
  <h1 class="page-title">Live voice assistant</h1>
  <p class="page-subtitle">Talk to KrishiKalyan's assistant in Hindi or English - tap the mark to start.</p>

  <div class="card">
    <div class="mic-wrap">
      <button class="logo-pad" id="micBtn" aria-label="Start talking">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path class="stem" d="M12 22V6"></path>
          <path class="leaf-tip" d="M12 6l-3-3M12 6l3-3"></path>
          <path class="leaf-mid" d="M9 10l-3-2M9 10l3 1M15 10l3-2M15 10l-3 1"></path>
          <path class="leaf-base" d="M9 14l-3-2M9 14l3 1M15 14l3-2M15 14l-3 1"></path>
        </svg>
      </button>
      <div class="mic-status" id="micStatus">Tap to start talking</div>
    </div>
  </div>

  <div class="card">
    <h4 style="margin:0 0 16px; font-family: var(--font-mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">Conversation</h4>
    <div class="captions" id="captions">
      <p class="empty-state">Nothing said yet.</p>
    </div>
  </div>
</div>

<script>
const micBtn = document.getElementById("micBtn");
const micStatus = document.getElementById("micStatus");
const captions = document.getElementById("captions");
const logoPad = micBtn;
const leafTip = micBtn.querySelector(".leaf-tip");
const leafMid = micBtn.querySelector(".leaf-mid");
const leafBase = micBtn.querySelector(".leaf-base");
const leaves = [
  { el: leafTip,  speed: 1.0, phase: 0.0 },
  { el: leafMid,  speed: 1.35, phase: 1.7 },
  { el: leafBase, speed: 1.6, phase: 3.4 },
];

let ws = null;
let micContext = null;
let micStream = null;
let processor = null;
let playbackContext = null;
let nextPlaybackTime = 0;
let active = false;

let currentUserLine = null;
let currentAssistantLine = null;

// --- Audio-reactive logo ---------------------------------------------
let micAnalyser = null;
let micData = null;
let playbackAnalyser = null;
let playbackData = null;

function getLevel(analyser, dataArray) {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  return Math.min(1, rms * 4); // speech RMS is small, so boost it into 0-1 range
}

function animateLogo(now) {
  requestAnimationFrame(animateLogo);
  const t = now / 1000;

  const micLevel = getLevel(micAnalyser, micData);
  const outLevel = getLevel(playbackAnalyser, playbackData);
  const level = Math.max(micLevel, outLevel);

  const speaking = active && outLevel > 0.02 && outLevel >= micLevel;
  const listening = active && !speaking && micLevel > 0.02;

  logoPad.classList.toggle("is-speaking", speaking);
  logoPad.classList.toggle("is-listening", listening);

  // gentle idle breathing baseline, boosted by whatever's actually being said
  const ambient = 0.5 + Math.sin(t * 1.3) * 0.5; // 0..1
  const scale = 1 + ambient * 0.02 + level * 0.16;
  const glow = Math.min(1, 0.15 + ambient * 0.1 + level * 0.85);
  logoPad.style.setProperty("--scale", scale.toFixed(3));
  logoPad.style.setProperty("--glow", glow.toFixed(3));

  leaves.forEach(({ el, speed, phase }) => {
    const sway = Math.sin(t * speed + phase) * (3 + level * 14);
    el.style.transform = `rotate(${sway.toFixed(2)}deg)`;
  });

  if (active) {
    micStatus.textContent = speaking ? "Speaking..." : "Listening...";
  } else if (micStatus.textContent !== "Microphone access denied or unavailable") {
    micStatus.textContent = "Tap to start talking";
  }
}
requestAnimationFrame(animateLogo);
// -----------------------------------------------------------------------

function appendToLine(who, text) {
  if (captions.querySelector(".empty-state")) captions.innerHTML = "";

  let lineRef = who === "user" ? currentUserLine : currentAssistantLine;

  if (!lineRef) {
    const div = document.createElement("div");
    div.className = "caption-line " + who;
    div.innerHTML = `<span class="who">${who === "user" ? "You" : "Assistant"}</span><p></p>`;
    captions.appendChild(div);
    lineRef = div.querySelector("p");
    if (who === "user") currentUserLine = lineRef;
    else currentAssistantLine = lineRef;
  }

  lineRef.textContent += text;
  captions.scrollTop = captions.scrollHeight;
}

// Call when a turn finishes, so the next chunk starts a fresh line
// instead of continuing to append to the finished one.
function endTurn(who) {
  if (who === "user") currentUserLine = null;
  else currentAssistantLine = null;
}

// Downsamples Float32 audio from the mic's native rate to 16kHz PCM16,
// which is what Gemini Live expects for input audio.
function downsampleTo16kPCM16(float32Data, inputSampleRate) {
  const targetRate = 16000;
  const ratio = inputSampleRate / targetRate;
  const newLength = Math.floor(float32Data.length / ratio);
  const result = new Int16Array(newLength);
  for (let i = 0; i < newLength; i++) {
    const srcIndex = Math.floor(i * ratio);
    const s = Math.max(-1, Math.min(1, float32Data[srcIndex]));
    result[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return result;
}

function int16ToBase64(int16Arr) {
  const bytes = new Uint8Array(int16Arr.buffer);
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// Gemini's native audio output is 24kHz PCM16 - decode and queue it for
// gapless playback.
function playPCM16Base64(base64Data) {
  if (!playbackContext) {
    playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    nextPlaybackTime = playbackContext.currentTime;
    playbackAnalyser = playbackContext.createAnalyser();
    playbackAnalyser.fftSize = 1024;
    playbackData = new Uint8Array(playbackAnalyser.fftSize);
    playbackAnalyser.connect(playbackContext.destination);
  }

  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);

  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

  const buffer = playbackContext.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);

  const source = playbackContext.createBufferSource();
  source.buffer = buffer;
  source.connect(playbackAnalyser);

  const startTime = Math.max(nextPlaybackTime, playbackContext.currentTime);
  source.start(startTime);
  nextPlaybackTime = startTime + buffer.duration;
}

async function startVoiceChat() {
  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${protocol}//${window.location.host}/voice-chat`);

  ws.onopen = () => console.log("[voice-chat] Connected to server.");

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }

    if (msg.error) {
      console.error("[voice-chat]", msg.error);
      micStatus.textContent = "Error - see console";
      return;
    }

    const serverContent = msg.serverContent;
    if (!serverContent) return;

    if (serverContent.modelTurn?.parts) {
      for (const part of serverContent.modelTurn.parts) {
        if (part.inlineData?.data) {
          playPCM16Base64(part.inlineData.data);
        }
      }
    }
    if (serverContent.inputTranscription?.text) {
      appendToLine("user", serverContent.inputTranscription.text);
    }
    if (serverContent.outputTranscription?.text) {
      appendToLine("assistant", serverContent.outputTranscription.text);
    }
    // Gemini signals the end of a full turn - start fresh lines next time
    // either speaker talks, instead of continuing to append.
    if (serverContent.turnComplete) {
      endTurn("user");
      endTurn("assistant");
    }
    if (serverContent.interrupted) {
      endTurn("assistant");
    }
  };

  ws.onerror = (err) => console.error("[voice-chat] WebSocket error:", err);
  ws.onclose = () => {
    console.log("[voice-chat] Server connection closed.");
    if (active) {
      active = false;
      micStatus.textContent = "Disconnected - tap to reconnect";
      stopVoiceChat();
    }
  };

  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  micContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = micContext.createMediaStreamSource(micStream);

  micAnalyser = micContext.createAnalyser();
  micAnalyser.fftSize = 1024;
  micData = new Uint8Array(micAnalyser.fftSize);
  source.connect(micAnalyser); // tap off for levels only - doesn't need to reach destination

  processor = micContext.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!active || !ws || ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = downsampleTo16kPCM16(input, micContext.sampleRate);
    ws.send(JSON.stringify({ type: "audio", data: int16ToBase64(pcm16) }));
  };

  source.connect(processor);
  processor.connect(micContext.destination);
}

function stopVoiceChat() {
  currentUserLine = null;
  currentAssistantLine = null;
  if (processor) processor.disconnect();
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (micContext) micContext.close();
  if (playbackContext) playbackContext.close();
  if (ws) ws.close();
  processor = null;
  micStream = null;
  micContext = null;
  micAnalyser = null;
  playbackContext = null;
  playbackAnalyser = null;
  nextPlaybackTime = 0;
  ws = null;
}

micBtn.addEventListener("click", async () => {
  if (!active) {
    active = true;
    micStatus.textContent = "Listening...";
    try {
      await startVoiceChat();
    } catch (err) {
      console.error(err);
      micStatus.textContent = "Microphone access denied or unavailable";
      active = false;
    }
  } else {
    active = false;
    micStatus.textContent = "Tap to start talking";
    stopVoiceChat();
  }
});
</script>

</body>
</html>
