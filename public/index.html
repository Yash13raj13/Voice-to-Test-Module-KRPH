<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e6e8eb;
    --text-muted: #8b909c;
    --accent: #4f8cff;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 0; margin-bottom: 28px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .upload-row { display: flex; gap: 12px; align-items: center; }
  input[type="file"] { color: var(--text-muted); font-size: 13px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Status bar */
  .status-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 13px; color: var(--text-muted); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.2s;
  }
  .status-dot.active { background: var(--accent); }
  .status-dot.done { background: var(--green); }
  .status-dot.error { background: var(--red); }
  .status-steps { display: flex; gap: 18px; }
  .status-step { display: flex; align-items: center; gap: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }

  .badge {
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 12px;
    display: inline-block;
  }
  .badge.positive { background: rgba(52,211,153,0.15); color: var(--green); }
  .badge.neutral  { background: rgba(139,144,156,0.15); color: var(--text-muted); }
  .badge.negative { background: rgba(248,113,113,0.15); color: var(--red); }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }

  /* Transcript modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 600px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
  }
  .modal-box pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .modal-close {
    float: right;
    background: transparent;
    color: var(--text-muted);
    padding: 4px 10px;
  }
  .link-btn {
    background: transparent;
    color: var(--accent);
    padding: 0;
    text-decoration: underline;
    font-size: 13px;
    cursor: pointer;
  }
</style>
