<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyze - Call Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/index.html" class="wordmark">Call<span>Ledger</span></a>
    <nav class="tabs">
      <a href="/index.html" class="active">Analyze</a>
      <a href="/reports.html">Reports</a>
    </nav>
  </div>
</div>

<div class="wrap">
  <h1 class="page-title">Analyze a call</h1>
  <p class="page-subtitle">Upload a recording to transcribe it and score tone &amp; handling quality.</p>

  <div class="card">
    <div class="upload-row" style="margin-bottom: 18px;">
      <input type="file" id="audioFile" accept="audio/*">
    </div>

    <label for="ticketDescription" style="display:block; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 8px;">
      Ticket / complaint description (optional)
    </label>
    <textarea id="ticketDescription" rows="3" placeholder="Paste the customer's original complaint or ticket description here, to check whether this call actually addressed it..." style="width:100%; font-family: var(--font-body); font-size: 0.88rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); resize: vertical;"></textarea>

    <div style="margin-top: 16px;">
      <button id="uploadBtn">Analyze call</button>
    </div>

    <div class="status-bar" id="statusBar" style="display:none;">
      <div class="status-step"><span class="status-dot" id="dot-upload"></span> Uploading</div>
      <div class="status-step"><span class="status-dot" id="dot-transcribe"></span> Transcribing</div>
      <div class="status-step"><span class="status-dot" id="dot-analyze"></span> Analyzing</div>
      <div class="status-step"><span class="status-dot" id="dot-done"></span> Done</div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <p style="margin:0 0 14px; color: var(--ink-soft); font-size: 0.9rem;">Call processed.</p>
    <a id="resultLink" href="#" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--forest-dark); border-bottom: 1px solid var(--gold); text-decoration: none;">View full report &rarr;</a>
  </div>
</div>

<script>
const fileInput = document.getElementById("audioFile");
const ticketDescription = document.getElementById("ticketDescription");
const uploadBtn = document.getElementById("uploadBtn");
const statusBar = document.getElementById("statusBar");
const resultCard = document.getElementById("resultCard");
const resultLink = document.getElementById("resultLink");

const dots = {
  upload: document.getElementById("dot-upload"),
  transcribe: document.getElementById("dot-transcribe"),
  analyze: document.getElementById("dot-analyze"),
  done: document.getElementById("dot-done"),
};

function setStep(step, state) {
  dots[step].className = "status-dot " + state;
}
function resetStatus() {
  Object.keys(dots).forEach((k) => (dots[k].className = "status-dot"));
}

uploadBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) return alert("Choose an audio file first.");

  uploadBtn.disabled = true;
  resultCard.style.display = "none";
  statusBar.style.display = "flex";
  resetStatus();
  setStep("upload", "active");

  const formData = new FormData();
  formData.append("audio", file);
  formData.append("ticketDescription", ticketDescription.value);

  try {
    const res = await fetch("/calls", { method: "POST", body: formData });
    setStep("upload", "done");
    setStep("transcribe", "active");
    setStep("analyze", "active");

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");

    setStep("transcribe", "done");
    setStep("analyze", "done");
    setStep("done", "done");

    resultLink.href = `/call.html?id=${encodeURIComponent(data.id)}`;
    resultCard.style.display = "block";
  } catch (err) {
    setStep("upload", "error");
    alert("Failed: " + err.message);
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>

</body>
</html>
